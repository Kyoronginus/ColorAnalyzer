<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Analysis Result - ColorAnalyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        /* カスタムカーソル（シャボン玉風） */
        .custom-cursor {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border: 2px solid rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
            backdrop-filter: blur(2px);
        }

        .custom-cursor::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 20%;
            height: 20%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }

        .custom-cursor.hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.9), rgba(100, 200, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow:
                0 0 30px rgba(100, 200, 255, 0.5),
                inset 0 0 20px rgba(100, 200, 255, 0.3);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .nav-btn.primary {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4, #45B7D1);
            color: white;
        }

        .nav-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .result-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .result-card h3 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .result-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-card img:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            margin: auto;
            padding: 20px;
            width: 90%;
            max-width: 1200px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #ff6b6b;
        }

        .modal-title {
            position: absolute;
            top: 20px;
            left: 35px;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="custom-cursor"></div>

    <div class="main-container">
        <div class="header">
            <h1>Color Analysis Result</h1>
            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn secondary">
                    🏠 Home
                </a>
                <a href="{{ url_for('result_3d', filename=original_image.split('/')[-1]) }}" class="nav-btn primary">
                    🎨 View in 3D
                </a>
            </div>
        </div>

        <div class="content-grid">
            <div class="result-card">
                <h3>Original Image</h3>
                <img src="{{ url_for('static', filename=original_image) }}" alt="Original Image">
            </div>

            <div class="result-card">
                <h3>Simplified Image</h3>
                <img src="{{ url_for('static', filename=simplified_image_path) }}" alt="Simplified Image">
            </div>

            <div class="result-card">
                <h3>Color Distribution</h3>
                <img src="{{ url_for('static', filename=color_distribution_path) }}" alt="Color Distribution">
            </div>

            <div class="result-card">
                <h3>Hue Distribution</h3>
                <img src="{{ url_for('static', filename=hue_distribution_path) }}" alt="Hue Distribution">
            </div>

            <div class="result-card">
                <h3>Brightness Distribution</h3>
                <img src="{{ url_for('static', filename=brightness_distribution_path) }}" alt="Brightness Distribution">
            </div>

            <div class="result-card">
                <h3>Saturation Distribution</h3>
                <img src="{{ url_for('static', filename=saturation_distribution_path) }}" alt="Saturation Distribution">
            </div>
        </div>
    </div>

    <!-- モーダル -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Graph View</div>
            <span class="close">&times;</span>
            <img class="modal-image" id="modalImage" src="" alt="Enlarged Graph">
        </div>
    </div>

    <script>
        // Three.js background animation (simplified version)
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const particleCount = 2000;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const color = new THREE.Color();

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 10;
            positions[i3 + 1] = (Math.random() - 0.5) * 10;
            positions[i3 + 2] = (Math.random() - 0.5) * 10;

            color.setHSL(Math.random(), 0.7, 0.5);
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.02,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particles, material);
        scene.add(particleSystem);

        const mouse = new THREE.Vector2();

        // カスタムカーソルとインタラクション要素の初期化
        const customCursor = document.querySelector('.custom-cursor');
        let isHovering = false;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // カスタムカーソルの位置更新
            customCursor.style.left = event.clientX + 'px';
            customCursor.style.top = event.clientY + 'px';
        });

        // ホバー効果の処理
        const interactiveElements = document.querySelectorAll('a, button, .result-card');
        interactiveElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                isHovering = true;
                customCursor.classList.add('hover');
            });

            element.addEventListener('mouseleave', () => {
                isHovering = false;
                customCursor.classList.remove('hover');
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0001;
            particleSystem.rotation.x = time * 0.25 + mouse.y * 0.05;
            particleSystem.rotation.y = time * 0.5 + mouse.x * 0.05;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // モーダル機能
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const closeBtn = document.querySelector('.close');

        // すべての画像にクリックイベントを追加
        document.querySelectorAll('.result-card img').forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = 'block';
                modalImage.src = this.src;
                modalTitle.textContent = this.alt;
                document.body.style.overflow = 'hidden'; // スクロールを無効化
            });
        });

        // モーダルを閉じる
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // スクロールを有効化
        });

        // モーダル背景をクリックして閉じる
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });

        // ESCキーでモーダルを閉じる
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'block') {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });
    </script>
</body>
</html>
