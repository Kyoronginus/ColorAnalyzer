<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Analyzer - Analyze the Universe of Color</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow-color: hsl(217, 100%, 50%);
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            line-height: 1.1;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2), 0 0 20px rgba(255,255,255,0.2);
        }
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            margin: 1rem 0 2.5rem 0;
            color: #a9a9b3;
            max-width: 600px;
        }
        #upload-form {
            width: 100%;
            max-width: 500px;
        }
        #drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px 20px;
            transition: background-color 0.3s, border-color 0.3s;
            cursor: pointer;
        }
        #drop-zone.dragover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--glow-color);
        }
        #drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: #ccc;
        }
        #file-input {
            display: none;
        }
        .upload-options {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .glowing-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .glowing-btn:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            background: radial-gradient(circle closest-side, var(--glow-color), transparent);
            transition: width 0.4s, height 0.4s;
            opacity: 0.5;
        }
        .glowing-btn:hover:before {
            width: 200%;
            height: 200%;
        }
        .glowing-btn span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <main class="main-container">
        <h1 class="title">Analyze the Universe of Color.</h1>
        <p class="subtitle">Upload an image to explore its color distribution in an interactive 3D space.</p>
        
        <form id="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
            <div id="drop-zone">
                <p>Drag & Drop your image here, or click to select</p>
                <input type="file" name="image" id="file-input" accept="image/*,.psd,.clip">
            </div>
            <div class="upload-options">
                <button type="submit" name="view_type" value="2d" class="glowing-btn"><span>2D Analysis</span></button>
                <button type="submit" name="view_type" value="3d" class="glowing-btn"><span>3D Visualization</span></button>
            </div>
        </form>
    </main>

    <script>
        // Interactive Background
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const particleCount = 5000;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const color = new THREE.Color();

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 10;
            positions[i3 + 1] = (Math.random() - 0.5) * 10;
            positions[i3 + 2] = (Math.random() - 0.5) * 10;
            
            color.setHSL(Math.random(), 0.7, 0.5);
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.02,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particles, material);
        scene.add(particleSystem);

        const mouse = new THREE.Vector2();
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0001;
            particleSystem.rotation.x = time * 0.25 + mouse.y * 0.1;
            particleSystem.rotation.y = time * 0.5 + mouse.x * 0.1;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Drag and Drop
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const form = document.getElementById('upload-form');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                // You might want to show the selected file name
                dropZone.querySelector('p').textContent = `${e.dataTransfer.files.length} file(s) selected`;
            }
        });
        fileInput.addEventListener('change', () => {
             if (fileInput.files.length) {
                dropZone.querySelector('p').textContent = `${fileInput.files.length} file(s) selected`;
            }
        });
    </script>
</body>
</html>
