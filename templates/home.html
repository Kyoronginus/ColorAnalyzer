<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Analyzer - Analyze the Universe of Color</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow-color: hsl(217, 100%, 50%);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* background: #000; */
            color: #fff;
            font-family: 'Inter', sans-serif;
            cursor: none;
        }



        /* カスタムカーソル（シャボン玉風） */
        .custom-cursor {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            /* background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1)); */
            border: 2px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: all 0.01s ease;
            backdrop-filter: blur(5px);
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .custom-cursor::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 20%;
            height: 20%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }

        .custom-cursor.hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.9), rgba(100, 200, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow:
                0 0 30px rgba(100, 200, 255, 0.5),
                inset 0 0 20px rgba(100, 200, 255, 0.3);
        }

        /* カーソルぼかし効果 */
        .cursor-blur {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cursor-blur.active {
            opacity: 1;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: transform 0.3s ease;
            transform: scale(1.1); /* ← この行を追加 */
        }

        /* 魚眼レンズ効果用のオーバーレイ */
        .fisheye-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    transparent 0%,
                    transparent 100px,
                    rgba(255, 255, 255, 0.02) 150px,
                    rgba(255, 255, 255, 0.05) 200px,
                    transparent 300px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fisheye-overlay.active {
            opacity: 1;
        }

        /* CSS Background Effects */
        .css-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: #000; /* <-- この行を追加 */
            overflow: hidden;
            transform: scale(1.2); /* ← この行を追加 */
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.7;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #667eea, #764ba2);
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #f093fb, #f5576c);
            top: 60%;
            right: 10%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #4facfe, #00f2fe);
            bottom: 20%;
            left: 20%;
            animation-delay: -14s;
        }

        .orb-4 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #a8edea, #fed6e3);
            top: 10%;
            right: 30%;
            animation-delay: -21s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -30px) scale(1.1);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            75% {
                transform: translate(20px, 30px) scale(1.05);
            }
        }

        .floating-particles-css {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .css-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: particleFloat 15s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 被写界深度効果 */
        .depth-of-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    transparent 0%,
                    transparent 200px,
                    rgba(0, 0, 0, 0.1) 400px,
                    rgba(0, 0, 0, 0.3) 600px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .depth-of-field.active {
            opacity: 1;
        }

        /* 色収差効果 */
        .chromatic-aberration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .chromatic-aberration::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(0, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 0, 0.1) 0%, transparent 50%);
        }

        .chromatic-aberration.active {
            opacity: 1;
        }

        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            line-height: 1.1;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            margin: 1rem 0 2.5rem 0;
            color: #a9a9b3;
            max-width: 600px;
        }

        #upload-form {
            width: 100%;
            max-width: 500px;
        }

        #drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px 20px;
            transition: background-color 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        #drop-zone.dragover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--glow-color);
        }

        #drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: #ccc;
        }

        #file-input {
            display: none;
        }

        .upload-options {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .glowing-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            background-color: #1a1a1a;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glowing-btn:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            background: radial-gradient(circle closest-side, var(--glow-color), transparent);
            transition: width 0.4s, height 0.4s;
            opacity: 0.5;
        }

        .glowing-btn:hover:before {
            width: 200%;
            height: 200%;
        }

        .glowing-btn span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="css-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="gradient-orb orb-4"></div>
        <div class="floating-particles-css"></div>
    </div>
    <div class="custom-cursor"></div>
    <div class="cursor-blur"></div>
    <div class="fisheye-overlay"></div>
    <div class="depth-of-field"></div>
    <div class="chromatic-aberration"></div>

    <main class="main-container">
        <h1 class="title">Analyze the Universe of Color.</h1>
        <p class="subtitle">Upload an image to explore its color distribution in an interactive 3D space.</p>

        <form id="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
            <div id="drop-zone">
                <p>Drag & Drop your image here, or click to select</p>
                <input type="file" name="image" id="file-input" accept="image/*,.psd,.clip">
            </div>
            <div class="upload-options">
                <button type="submit" name="view_type" value="2d" class="glowing-btn"><span>2D Analysis</span></button>
                <button type="submit" name="view_type" value="3d" class="glowing-btn"><span>3D
                        Visualization</span></button>
            </div>
        </form>
    </main>

    <script>
        // Interactive Background
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0); // 第2引数で透明度を0にする
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const particleCount = 5000;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const color = new THREE.Color();

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 10;
            positions[i3 + 1] = (Math.random() - 0.5) * 10;
            positions[i3 + 2] = (Math.random() - 0.5) * 10;

            color.setHSL(Math.random(), 0.7, 0.5);
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.02,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particles, material);
        scene.add(particleSystem);

        const mouse = new THREE.Vector2();

        // カスタムカーソルとインタラクション要素の初期化
        const customCursor = document.querySelector('.custom-cursor');
        const cursorBlur = document.querySelector('.cursor-blur');
        const fisheyeOverlay = document.querySelector('.fisheye-overlay');
        const depthOfField = document.querySelector('.depth-of-field');
        const chromaticAberration = document.querySelector('.chromatic-aberration');
        let isHovering = false;

        // CSS背景パーティクルを作成
        function createCSSParticles() {
            const particlesContainer = document.querySelector('.floating-particles-css');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'css-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // CSS背景を初期化
        createCSSParticles();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // カスタムカーソルの位置更新
            customCursor.style.left = event.clientX + 'px';
            customCursor.style.top = event.clientY + 'px';

            // カーソルぼかし効果の位置更新
            cursorBlur.style.left = event.clientX + 'px';
            cursorBlur.style.top = event.clientY + 'px';

            // 魚眼レンズ効果の位置更新
            const mouseXPercent = (event.clientX / window.innerWidth) * 100;
            const mouseYPercent = (event.clientY / window.innerHeight) * 100;
            fisheyeOverlay.style.setProperty('--mouse-x', mouseXPercent + '%');
            fisheyeOverlay.style.setProperty('--mouse-y', mouseYPercent + '%');

            // 被写界深度効果の位置更新
            depthOfField.style.setProperty('--mouse-x', mouseXPercent + '%');
            depthOfField.style.setProperty('--mouse-y', mouseYPercent + '%');

            // 背景の微妙な移動効果
            const bgCanvas = document.getElementById('bg-canvas');
            const moveX = (event.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (event.clientY - window.innerHeight / 2) * 0.01;
            bgCanvas.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.02)`;

            // CSS背景の移動効果
            const cssBackground = document.querySelector('.css-background');
            if (cssBackground) {
                const bgMoveX = (event.clientX - window.innerWidth / 2) * 0.005;
                const bgMoveY = (event.clientY - window.innerHeight / 2) * 0.005;
                cssBackground.style.transform = `translate(${bgMoveX}px, ${bgMoveY}px)`;
            }
        });

        // ホバー効果の処理
        const interactiveElements = document.querySelectorAll('button, .drop-zone, a');
        interactiveElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                isHovering = true;
                customCursor.classList.add('hover');
                cursorBlur.classList.add('active');
                fisheyeOverlay.classList.add('active');
                depthOfField.classList.add('active');
                chromaticAberration.classList.add('active');
            });

            element.addEventListener('mouseleave', () => {
                isHovering = false;
                customCursor.classList.remove('hover');
                cursorBlur.classList.remove('active');
                fisheyeOverlay.classList.remove('active');
                depthOfField.classList.remove('active');
                chromaticAberration.classList.remove('active');
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0001;

            // 基本的な回転
            particleSystem.rotation.x = time * 0.25 + mouse.y * 0.1;
            particleSystem.rotation.y = time * 0.5 + mouse.x * 0.1;

            // ホバー時の魚眼レンズ効果
            if (isHovering) {
                // パーティクルの位置を動的に変更して魚眼効果を作成
                const positions = particleSystem.geometry.attributes.position.array;
                const originalPositions = particleSystem.geometry.userData.originalPositions;

                if (!originalPositions) {
                    // 初回のみ元の位置を保存
                    particleSystem.geometry.userData.originalPositions = new Float32Array(positions);
                }

                for (let i = 0; i < positions.length; i += 3) {
                    const x = originalPositions ? originalPositions[i] : positions[i];
                    const y = originalPositions ? originalPositions[i + 1] : positions[i + 1];
                    const z = originalPositions ? originalPositions[i + 2] : positions[i + 2];

                    // マウス位置からの距離を計算
                    const mouseWorldX = mouse.x * 5;
                    const mouseWorldY = mouse.y * 5;
                    const distance = Math.sqrt((x - mouseWorldX) ** 2 + (y - mouseWorldY) ** 2);

                    // 魚眼効果の強度
                    const fisheyeStrength = Math.max(0, 1 - distance / 2);
                    const distortion = fisheyeStrength * 0.3;

                    positions[i] = x + (x - mouseWorldX) * distortion;
                    positions[i + 1] = y + (y - mouseWorldY) * distortion;
                    positions[i + 2] = z + distortion * 0.5;
                }

                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else {
                // ホバーが外れたら元の位置に戻す処理
                const positions = particleSystem.geometry.attributes.position.array;
                const originalPositions = particleSystem.geometry.userData.originalPositions;

                if (originalPositions) {
                    // 元の位置データが存在すれば、それをコピーして戻す
                    for (let i = 0; i < positions.length; i++) {
                        positions[i] = originalPositions[i];
                    }
                    particleSystem.geometry.attributes.position.needsUpdate = true;
                    // 一度戻したら元の位置データは不要になるので削除してもよい
                    delete particleSystem.geometry.userData.originalPositions;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Drag and Drop
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const form = document.getElementById('upload-form');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                // You might want to show the selected file name
                dropZone.querySelector('p').textContent = `${e.dataTransfer.files.length} file(s) selected`;
            }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                dropZone.querySelector('p').textContent = `${fileInput.files.length} file(s) selected`;
            }
        });
    </script>
</body>

</html>
