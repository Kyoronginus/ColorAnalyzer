<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Cosmos - 3D Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Three.js Extras -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: #000;
            color: #fff;
            cursor: none;
        }

        /* カスタムカーソル（シャボン玉風） */
        .custom-cursor {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border: 2px solid rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
            backdrop-filter: blur(2px);
        }

        .custom-cursor::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 20%;
            height: 20%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }

        .custom-cursor.hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.9), rgba(100, 200, 255, 0.4), rgba(100, 200, 255, 0.1));
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow:
                0 0 30px rgba(100, 200, 255, 0.5),
                inset 0 0 20px rgba(100, 200, 255, 0.3);
        }

        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #three-container.fly-mode {
            cursor: crosshair;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 320px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: #ccc;
        }

        .mode-selector button, .control-button {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .mode-selector button:hover, .control-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .mode-selector button.active {
            background-color: #007BFF;
            border-color: #007BFF;
        }

        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #007BFF; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 16px auto;
        }

        #pointer-lock-instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            z-index: 20;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>
    <div id="three-container"></div>

    <div id="pointer-lock-instructions">
        <div>
            Click to start exploring
            <br>
            (W, A, S, D = Move, MOUSE = Look, ESC = Release)
        </div>
    </div>

    <div id="loading-indicator">
        <div class="spinner"></div>
        <p>Loading Color Cosmos...</p>
    </div>

    <div class="ui-panel">
        <div class="control-group">
            <label>Color Space</label>
            <div class="mode-selector">
                <button id="rgb-mode" class="active" onclick="switchColorSpace('rgb')">RGB</button>
                <button id="hsv-mode" onclick="switchColorSpace('hsv')">HSV</button>
            </div>
        </div>
        <!-- <div class="control-group">
            <label>Camera Mode</label>
            <div class="mode-selector">
                <button id="orbit-mode" class="active" onclick="switchControls('orbit')">Orbit</button>
                <button id="fly-mode" onclick="switchControls('fly')">Fly</button>
            </div>
        </div> -->
        <div class="control-group">
            <label for="bloom-strength">Bloom Strength</label>
            <input type="range" id="bloom-strength" min="0" max="3" step="0.1" value="1.5" onchange="updateBloom(this.value)">
        </div>
        <div class="control-group">
            <label>Background Color</label>
            <div class="mode-selector">
                <button id="bg-dark" class="active" onclick="switchBackground('dark')">Dark</button>
                <button id="bg-light" onclick="switchBackground('light')">Light</button>
            </div>
        </div>
        <div class="control-group">
            <a href="{{ url_for('home') }}" class="control-button" style="text-decoration: none;">🏠 New Image</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/three-color-visualizer.js') }}"></script>
    
    <script>
        let visualizer = null;

        document.addEventListener('DOMContentLoaded', function() {
            try {
                visualizer = new ColorVisualizer3D('three-container');
                
                const colorData = {{ color_data_3d | tojson | safe }};
                const hsvData = {{ hsv_data_3d | tojson | safe }};

                visualizer.loadColorData(colorData, hsvData);

                document.getElementById('loading-indicator').style.display = 'none';

            } catch (error) {
                console.error('Failed to initialize 3D visualizer:', error);
                const loadingIndicator = document.getElementById('loading-indicator');
                loadingIndicator.innerHTML = `<p style="color: #ff4444;">Error: Could not initialize 3D view.</p>`;
            }
        });

        function switchColorSpace(mode) {
            document.querySelectorAll('.mode-selector button[id$="-mode"]').forEach(btn => btn.classList.remove('active'));
            document.getElementById(mode + '-mode').classList.add('active');
            if (visualizer) visualizer.setVisualizationMode(mode);
        }

        function switchControls(mode) {
            document.querySelectorAll('.mode-selector button[id$="-mode"]').forEach(btn => {
                if(btn.id.includes('orbit') || btn.id.includes('fly')) {
                    btn.classList.remove('active');
                }
            });
            document.getElementById(mode + '-mode').classList.add('active');
            if (visualizer) visualizer.setControls(mode);
        }

        function updateBloom(value) {
            if (visualizer) visualizer.setBloomStrength(parseFloat(value));
        }

        function switchBackground(mode) {
            document.querySelectorAll('#bg-dark, #bg-light').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('bg-' + mode).classList.add('active');

            if (visualizer) {
                if (mode === 'light') {
                    visualizer.scene.background = new THREE.Color(0xffffff);
                } else {
                    visualizer.scene.background = new THREE.Color(0x000000);
                }
            }
        }

        // // カスタムカーソル
        // const customCursor = document.querySelector('.custom-cursor');

        // document.addEventListener('mousemove', (e) => {
        //     customCursor.style.left = e.clientX + 'px';
        //     customCursor.style.top = e.clientY + 'px';
        // });

        // // ホバー効果
        // document.querySelectorAll('button, .ui-panel').forEach(element => {
        //     element.addEventListener('mouseenter', () => {
        //         customCursor.classList.add('hover');
        //     });

        //     element.addEventListener('mouseleave', () => {
        //         customCursor.classList.remove('hover');
        //     });
        // });
    </script>
</body>
</html>
